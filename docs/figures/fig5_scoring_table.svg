    <text style="fill: #ffffff; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="155.628" y="21.690469" transform="rotate(-0 155.628 21.690469)">Description &amp; data sources</text>
   </g>
   <g id="text_5">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="41.810859" transform="rotate(-0 26.73 41.810859)">Nuclear localization</text>
   </g>
   <g id="text_6">
    <text style="fill: #1e3a5f; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="42.070078" transform="rotate(-0 120.474 42.070078)">x4</text>
   </g>
   <g id="text_7">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 38.369504)">UniProt subcellular location, HPA IF images, GO-CC</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 44.732059)">(IDA/IMP evidence). Nucleus + chromatin specificity.</text>
   </g>
   <g id="text_8">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="61.970859" transform="rotate(-0 26.73 61.970859)">Protein size</text>
   </g>
   <g id="text_9">
    <text style="fill: #1e3a5f; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="62.230078" transform="rotate(-0 120.474 62.230078)">x1</text>
   </g>
   <g id="text_10">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 58.529504)">Amino acid length from UniProt. Optimal range</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 64.892059)">300-800 aa scored highest (experimental tractability).</text>
   </g>
   <g id="text_11">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="82.088203" transform="rotate(-0 26.73 82.088203)">Research novelty</text>
   </g>
   <g id="text_12">
    <text style="fill: #1e3a5f; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="82.390078" transform="rotate(-0 120.474 82.390078)">x5</text>
   </g>
   <g id="text_13">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 78.73823)">PubMed publication count. &lt; 50 papers = high novelty.</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 85.013645)">Prioritizes under-studied candidates.</text>
   </g>
   <g id="text_14">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="102.290859" transform="rotate(-0 26.73 102.290859)">3D structure</text>
   </g>
   <g id="text_15">
    <text style="fill: #1e3a5f; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="102.550078" transform="rotate(-0 120.474 102.550078)">x3</text>
   </g>
   <g id="text_16">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 98.923582)">AlphaFold pLDDT confidence, PDB entries,</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 105.134543)">domain-level structural quality assessment.</text>
   </g>
   <g id="text_17">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="122.408203" transform="rotate(-0 26.73 122.408203)">Regulatory domains</text>
   </g>
   <g id="text_18">
    <text style="fill: #1e3a5f; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="122.710078" transform="rotate(-0 120.474 122.710078)">x2</text>
   </g>
   <g id="text_19">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 119.051355)">InterPro / SMART / Pfam annotation. Chromatin-binding,</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 125.32677)">DNA-binding, and enzymatic domains scored highest.</text>
   </g>
   <g id="text_20">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="142.610859" transform="rotate(-0 26.73 142.610859)">PPI network</text>
   </g>
   <g id="text_21">
    <text style="fill: #1e3a5f; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="142.870078" transform="rotate(-0 120.474 142.870078)">x3</text>
   </g>
   <g id="text_22">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 139.167785)">IntAct / STRING / BioGRID interaction data. Weighted</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 145.53034)">by regulatory partner enrichment in chromatin/RNA.</text>
   </g>
   <g id="text_23">
    <text style="fill: #111111; font: 700 6.5px 'Arial', sans-serif; text-anchor: start" x="26.73" y="162.770859" transform="rotate(-0 26.73 162.770859)">Cross-validation</text>
   </g>
   <g id="text_24">
    <text style="fill: #e67e22; font: 700 7.5px 'Arial', sans-serif; text-anchor: start" x="120.474" y="163.030078" transform="rotate(-0 120.474 163.030078)">bonus</text>
   </g>
   <g id="text_25">
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 159.325551)">0 to +3 concordance bonus for multi-source agreement</text>
    <text style="fill: #6b7280; font: 5.5px 'Arial', sans-serif" transform="translate(159.534 165.692574)">across all databases (UniProt, HPA, GO, PDB).</text>
   </g>
  </g>
 </g>
